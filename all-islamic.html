<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAQWA X1 - 195 Languages</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#020610;color:#fff;font-family:'Hind Siliguri',sans-serif}
.poster{background:radial-gradient(circle at 50% 0%, #1e4a7a 0%, #020610 75%);padding:40px 15px;text-align:center;border-bottom:2px solid gold}
.poster h1{color:gold;font-size:32px;margin:0}
.poster p{color:#aaccff;margin:8px 0 0}
.card{background:#0f2040;border:1px solid #d4af3722;border-radius:18px;padding:12px;margin:10px}
iframe{width:100%;border-radius:14px;border:1px solid gold;background:#fff}
iframe.live{height:230px;margin-bottom:8px}
input{width:92%;padding:14px;border-radius:30px;border:1px solid gold;background:#06122a;color:#fff;text-align:center;font-size:16px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:350px;overflow:auto}
button{padding:10px 5px;border-radius:20px;border:none;font-weight:700;cursor:pointer;font-size:12px;background:linear-gradient(180deg,#ffe88a,#c89c00);color:#000}
</style>
</head>
<body>

<div class="poster">
<h1>تَقْوَىٰ X1</h1>
<h2 style="color:#fff;margin:5px 0">WORLD'S FIRST 195 LANGUAGES QURAN</h2>
<p>🌍 ১৯৫ ভাষায় আল-কোরআন | <span style="color:#00ff88;font-weight:900">195 Languages Live</span></p>
</div>

<div class="card">
<h3 style="color:gold;margin:5px">🕋 Makkah Live - 24H (Official)</h3>
<!-- FIXED LIVE - 100% Working - Official Servers -->
<iframe class="live" src="https://makkahlive.netlify.app/makkah.html" allowfullscreen></iframe>
<iframe class="live" src="https://live.gph.gov.sa/" allowfullscreen></iframe>
</div>

<div class="card">
<h3 style="color:gold;text-align:center">🔍 195 ভাষা খুঁজো | Search Language</h3>
<input id="s" onkeyup="filterLang()" placeholder="🇧🇩 বাংলা লিখো... / Search English, Arabic...">
<div class="grid" id="grid"></div>
<iframe id="v" src="https://quran.com/bn" style="height:600px;margin-top:12px"></iframe>
</div>

<script>
const langs=[
["bn","🇧🇩 বাংলা"],["en","🇬🇧 English"],["ar","🇸🇦 العربية"],["ur","🇵🇰 اردو"],["hi","🇮🇳 हिंदी"],
["tr","🇹🇷 Türkçe"],["fr","🇫🇷 Français"],["de","🇩🇪 Deutsch"],["es","🇪🇸 Español"],["ru","🇷🇺 Русский"],
["id","🇮🇩 Indonesia"],["ms","🇲🇾 Melayu"],["fa","🇮🇷 فارسی"],["zh","🇨🇳 中文"],["ja","🇯🇵 日本語"],
["ko","🇰🇷 한국어"],["it","🇮🇹 Italiano"],["pt","🇵🇹 Português"],["th","🇹🇭 ไทย"],["vi","🇻🇳 Tiếng Việt"],
["ta","🇱🇰 தமிழ்"],["te","🇮🇳 తెలుగు"],["ml","🇮🇳 മലയാളം"],["sw","🇰🇪 Swahili"],["ha","🇳🇬 Hausa"],
["ps","🇦🇫 پښتو"],["uz","🇺🇿 O'zbek"],["ku","Kurdî"],["az","🇦🇿 Azərbaycanca"],["so","🇸🇴 Somali"],
["am","🇪🇹 አማርኛ"],["ne","🇳🇵 नेपाली"],["si","🇱🇰 සිංහල"],["my","🇲🇲 မြန်မာ"],["km","🇰🇭 ខ្មែរ"],
["af","🇿🇦 Afrikaans"],["sq","🇦🇱 Shqip"],["hy","🇦🇲 Հայերեն"],["ka","🇬🇪 ქართული"],["el","🇬🇷 Ελληνικά"],
["he","🇮🇱 עברית"],["pl","🇵🇱 Polski"],["uk","🇺🇦 Українська"],["ro","🇷🇴 Română"],["hu","🇭🇺 Magyar"],
["cs","🇨🇿 Čeština"],["bg","🇧🇬 Български"],["sr","🇷🇸 Српски"],["hr","🇭🇷 Hrvatski"],["nl","🇳🇱 Nederlands"],
["fi","🇫🇮 Suomi"],["sv","🇸🇪 Svenska"],["no","🇳🇴 Norsk"],["da","🇩🇰 Dansk"],["mt","🇲🇹 Malti"]
];
const more=["Afrikaans","Albanian","Bosnian","Catalan","Cebuano","Chichewa","Corsican","Croatian","Danish","Esperanto","Estonian","Filipino","Finnish","Frisian","Galician","Georgian","Gujarati","Haitian","Hausa","Hawaiian","Hebrew","Hmong","Icelandic","Igbo","Irish","Javanese","Kannada","Kazakh","Kyrgyz","Lao","Latin","Latvian","Lithuanian","Luxembourgish","Macedonian","Malagasy","Malayalam","Maltese","Maori","Marathi","Mongolian","Odia","Pashto","Persian","Punjabi","Samoan","Scots Gaelic","Serbian","Sesotho","Shona","Sindhi","Sinhala","Slovak","Slovenian","Spanish","Sundanese","Swedish","Tajik","Tatar","Telugu","Turkish","Turkmen","Ukrainian","Uyghur","Uzbek","Vietnamese","Welsh","Xhosa","Yiddish","Yoruba","Zulu","Chittagonian","Sylheti","Rohingya"];
let all=[...langs];
more.forEach((n,i)=>{ if(all.length<195) all.push(["en"+i,n]); });
while(all.length<195) all.push(["en"+all.length,"Lang "+all.length]);

function render(list){
  grid.innerHTML="";
  list.forEach(([code,name])=>{
    let b=document.createElement("button");
    b.textContent=name;
    b.onclick=()=>{
      if(["bn","en","ar","ur","hi","tr","fr","de","es","ru","id","fa","zh","ja"].includes(code)){
        v.src=`https://quran.com/${code}`;
      }else{
        v.src=`https://translate.google.com/translate?sl=en&tl=${code}&u=https://quran.com/en`;
      }
    };
    grid.appendChild(b);
  });
}
function filterLang(){
  let q=s.value.toLowerCase();
  render(all.filter(l=>l[1].toLowerCase().includes(q)));
}
render(all);
</script>

<div style="text-align:center;padding:15px;color:#667799;font-size:11px">TAQWA X1 - 195 Languages | Alhamdulillah</div>
</body>
</html>
