<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AZAD BOSS PANEL</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Hind Siliguri;background:#000;color:#fff;padding:15px}.top{background:linear-gradient(90deg,#FFD700,#FF6B00);padding:15px;text-align:center;color:#000;font-weight:bold;border-radius:10px}.card{background:#111;margin:15px 0;padding:20px;border-radius:15px;border:1px solid #222}.btn{background:linear-gradient(90deg,#FFD700,#FF6B00);color:#000;padding:12px;border:none;border-radius:25px;width:100%;font-weight:bold;margin-top:10px;cursor:pointer}input{width:100%;padding:12px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;margin-top:10px}.badge{padding:5px 10px;border-radius:20px;font-size:12px}.approved{background:#00ff88;color:#000}.pending{background:#FF6B00;color:#000}table{width:100%;margin-top:10px;border-collapse:collapse}td{padding:10px;border-bottom:1px solid #222}</style></head><body><div class="top">AZAD BOSS PANEL - Super Admin Only</div><div class="card" id="loginBox"><h3>🔐 Super Admin Login</h3><input id="pass" type="password" placeholder="Boss Password দাও"><button class="btn" onclick="login()">Login</button><p style="color:#444;font-size:11px;margin-top:10px">Demo Pass: AZAD-777</p></div><div class="card" id="panel" style="display:none"><h3>👑 7/8 জন Staff Control</h3><p style="color:#00ff88">Status: Boss Active | আগে কাজ পরে টাকা</p><table id="staffTable"></table><button class="btn" style="background:#222;color:#FFD700;border:1px solid #FFD700" onclick="location.reload()">LogOut</button></div><script>let staff=[{name:"Staff 1 - Rashed",phone:"017xx",work:"Translate",status:"pending"},{name:"Staff 2 - Karim",phone:"018xx",work:"Voice",status:"pending"},{name:"Staff 3 - Jamil",phone:"019xx",work:"ERP",status:"approved"},{name:"Staff 4 - Sohel",phone:"015xx",work:"Download",status:"pending"},{name:"Staff 5 - Anowar",phone:"016xx",work:"Support",status:"pending"},{name:"Staff 6 - Malek",phone:"013xx",work:"Sales",status:"pending"},{name:"Staff 7 - Azad",phone:"014xx",work:"Boss Assistant",status:"approved"},{name:"Staff 8 - Reserve",phone:"---",work:"Backup",status:"pending"}];function login(){if(document.getElementById('pass').value==='AZAD-777'){document.getElementById('loginBox').style.display='none';document.getElementById('panel').style.display='block';render();}else{alert('Wrong Boss Password!');}}function render(){let h='<tr><td>নাম</td><td>কাজ</td><td>Status</td><td>Action</td></tr>';staff.forEach((s,i)=>{h+=`<tr><td>${s.name}<br><small>${s.phone}</small></td><td>${s.work}</td><td><span class="badge ${s.status}">${s.status}</span></td><td><button onclick="toggle(${i})" style="padding:5px 10px;border-radius:15px;border:none;cursor:pointer;background:#FFD700">${s.status==='approved'?'Block':'Approve'}</button></td></tr>`;});document.getElementById('staffTable').innerHTML=h;}function toggle(i){staff[i].status=staff[i].status==='approved'?'pending':'approved';render();alert(staff[i].name+' এখন '+staff[i].status);}</script><div style="text-align:center;padding:20px;color:#444;font-size:11px">M.A. MALEK & ANOWARA - Boss Permission System<br>No One Can Work Without Boss Approval</div></body></html>
