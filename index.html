<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TAQWA X1 TRANSLATOR - LIVE</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col text-white bg-black">
<header class="p-4 border-b border-green-500/20 flex justify-between items-center bg-black">
<div class="flex items-center gap-2 font-bold">TAQWA X1 TRANSLATOR • <span class="text-green-400">LIVE - ALL LANG</span></div>
</header>

<div class="p-4 flex gap-2 bg-black">
<select id="src" class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl w-1/2 outline-none">
<option value="auto">Auto Detect</option>
<option value="en">English</option>
<option value="bn">Bangla</option>
<option value="ar">Arabic</option>
<option value="hi">Hindi</option>
<option value="ur">Urdu</option>
</select>
<select id="tgt" class="bg-zinc-900 border border-green-500/40 p-3 rounded-xl w-1/2 outline-none">
<option value="bn">Bangla</option>
<option value="en">English</option>
<option value="ar">Arabic</option>
<option value="hi">Hindi</option>
<option value="ur">Urdu</option>
</select>
</div>

<div class="flex-1 p-4 space-y-3 bg-black">
<textarea id="input" class="w-full h-36 bg-zinc-900 border border-zinc-800 p-4 rounded-2xl outline-none focus:border-green-500" placeholder="যেকোনো ভাষায় লেখো... Live Translate হবে!"></textarea>
<div id="output" class="w-full min-h-36 bg-green-500/10 border border-green-500/20 p-4 rounded-2xl text-lg">Translation will appear here...</div>
<button onclick="translateNow()" class="w-full bg-white text-black py-3 rounded-2xl font-bold">TRANSLATE NOW</button>
</div>

<script>
const BACKEND = "https://taqwa-x1-engine-kmfo.onrender.com";
async function translateNow(){
let text = document.getElementById('input').value.trim();
if(!text) return;
let target = document.getElementById('tgt').value;
let source = document.getElementById('src').value;
document.getElementById('output').innerText = "Translating...";
try{
let res = await fetch(`${BACKEND}/predict?text=${encodeURIComponent(text)}&target=${target}&source=${source}`);
let data = await res.json();
console.log(data);
document.getElementById('output').innerText = data.translated || data.translation || "Error - Try again!";
}catch(e){
document.getElementById('output').innerText = "Engine warming up... Wait 5 sec and click Translate again!";
}
}
</script>
</body>
</html>
