<!-- AZAD X1 - PROFESSIONAL - FINAL -->
<div style="max-width:480px;margin:auto;background:#070f1f;color:#fff;font-family:system-ui;padding:12px">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
  <b style="font-size:22px;color:#f5d58f;letter-spacing:1px">AZAD X1</b>
  <span style="background:#2ee6a6;color:#000;padding:5px 12px;border-radius:99px;font-size:11px;font-weight:900">● LIVE</span>
</div>

<input placeholder="Search..." style="width:100%;background:#0f1c36;border:1px solid rgba(245,213,143,.2);color:#fff;padding:14px;border-radius:99px;margin-bottom:12px">

<div style="background:#0f1c36;border:2px solid #f5d58f;border-radius:18px;padding:14px">
  <div style="display:flex;justify-content:space-between;margin-bottom:10px">
    <b style="color:#f5d58f">155 Language Live</b>
    <select id="toLang" style="background:#070f1f;color:#fff;border:1px solid rgba(245,213,143,.2);padding:6px 10px;border-radius:99px;font-size:12px">
      <option value="en">English</option><option value="bn">Bangla</option><option value="ar">Arabic</option><option value="hi">Hindi</option><option value="es">Spanish</option><option value="fr">French</option>
    </select>
  </div>
  <video id="v" autoplay muted playsinline style="width:100%;height:200px;background:#000;border-radius:12px;object-fit:cover"></video>
  <div id="liveTxt" style="background:#000;padding:10px;border-radius:10px;margin-top:8px;min-height:50px;font-size:13px;color:#8aa0c3">Ready for live...</div>
  <button onclick="startLive()" style="width:100%;margin-top:10px;background:#fff;color:#000;border:0;padding:14px;border-radius:99px;font-weight:900">Start Live Call</button>
</div>

<div style="background:#0f1c36;border:1px solid rgba(245,213,143,.18);border-radius:18px;padding:12px;margin-top:12px">
  <b style="color:#f5d58f">AZAD AI Chat</b>
  <div id="chat" style="height:240px;overflow-y:auto;background:#000;border-radius:12px;padding:10px;margin:10px 0"></div>
  <div style="display:flex;gap:8px">
    <input id="msg" placeholder="Type message..." style="flex:1;background:#070f1f;border:1px solid rgba(245,213,143,.18);color:#fff;padding:12px;border-radius:99px">
    <button onclick="sendMsg()" style="background:#f5d58f;color:#000;border:0;padding:12px 18px;border-radius:99px;font-weight:900">Send</button>
  </div>
</div>

</div>

<script>
async function startLive(){
  let s=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720},audio:true});
  document.getElementById('v').srcObject=s;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=new SR(); rec.continuous=true; rec.interimResults=true;
  rec.onresult=async e=>{
    let txt=Array.from(e.results).map(r=>r[0].transcript).join('');
    let to=document.getElementById('toLang').value;
    let r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(txt)}&langpair=auto|${to}`);
    let d=await r.json();
    document.getElementById('liveTxt').innerHTML=`${txt}<br><b style="color:#2ee6a6">${d.responseData.translatedText}</b>`;
    let u=new SpeechSynthesisUtterance(d.responseData.translatedText); u.lang=to; speechSynthesis.speak(u);
  }; rec.start();
}
async function sendMsg(){
  let i=document.getElementById('msg'); let t=i.value; if(!t) return;
  let c=document.getElementById('chat'); c.innerHTML+=`<div style="background:#f5d58f;color:#000;padding:8px 12px;border-radius:16px 16px 4px 16px;margin:6px 0;margin-left:auto;width:fit-content;max-width:80%">${t}</div>`; i.value='';
  let to=document.getElementById('toLang').value;
  let r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=auto|${to}`);
  let d=await r.json();
  c.innerHTML+=`<div style="background:#0e1e38;padding:8px 12px;border-radius:16px 16px 16px 4px;margin:6px 0;width:fit-content;max-width:80%">${d.responseData.translatedText}</div>`;
  c.scrollTop=c.scrollHeight;
}
</script>
