<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAQWA X1 UNDELETEABLE</title><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Anek+Bangla:wght@500&family=Amiri:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet"><style>body{margin:0;background:#0a0f1a;color:#fff;font-family:'JetBrains Mono',monospace}header{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#111a2a;border-bottom:2px solid #00ff88}.x1{background:#00ff88;color:#000;padding:6px 14px;border-radius:10px;font-weight:900}.live{background:#1e2a3f;color:#7dd3ff;padding:6px 12px;border-radius:20px;font-size:12px}.card{background:#111a2a;margin:12px;border-radius:18px;padding:12px;border:1px solid #1e2a3f}.sel,textarea{width:100%;background:#0e1728;color:#fff;border:1px solid #2a3a5a;border-radius:14px;padding:14px;box-sizing:border-box;margin:8px 0;font-size:16px}textarea{min-height:130px;resize:none}.btn-main{width:100%;background:#00ff88;color:#000;border:none;padding:18px;border-radius:14px;font-weight:900;font-size:17px;letter-spacing:0.5px}.btn-row{display:flex;gap:10px;margin-top:12px}.btn-sm{flex:1;background:#1a253a;color:#fff;border:1px solid #2a3a5a;padding:12px;border-radius:12px}.flag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;max-height:90px;overflow:auto;background:#0e1728;border-radius:10px;padding:6px;margin-top:8px}.flag-item{background:#1a253a;padding:2px;border-radius:5px;font-size:8px;text-align:center}.font-bn{font-family:'Anek Bangla',sans-serif}.font-ar{font-family:'Amiri',serif}.font-hand{font-family:'Patrick Hand',cursive}</style></head><body><header><div style="display:flex;align-items:center;gap:8px"><span class="x1">X1</span><b>TAQWA X1 -<br>UNDELETEABLE</b></div><div class="live">133 LANG •<br>LIVE</div></header><div class="card"><button onclick="startVoice()" style="background:#1e2a3f;color:#00ff88;border:1px solid #2a3a5a;padding:8px 14px;border-radius:10px">🎤 বলো</button> <input type="file" id="cam" accept="image/*" capture style="font-size:12px"><div style="display:flex;gap:6px"><select id="fontSel" onchange="changeFont()" class="sel" style="flex:1"><option value="font-bn">🎨 বাংলা</option><option value="font-ar">🎨 আরবি</option><option value="font-hand">🎨 হাতের লেখা</option></select><select id="l" class="sel" style="flex:1"><option value="bn">🇧🇩 বাংলা - BD</option><option value="en">🇺🇸 English</option><option value="as">🇮🇳 Assamese</option><option value="hi">🇮🇳 Hindi</option><option value="ur">🇮🇳 Urdu</option><option value="ta">🇮🇳 Tamil</option><option value="te">🇮🇳 Telugu</option><option value="ml">🇮🇳 Malayalam</option><option value="kn">🇮🇳 Kannada</option><option value="mr">🇮🇳 Marathi</option><option value="gu">🇮🇳 Gujarati</option><option value="pa">🇮🇳 Punjabi</option><option value="or">🇮🇳 Odia</option><option value="bho">🇮🇳 Bhojpuri</option><option value="mai">🇮🇳 Maithili</option><option value="ar">🇸🇦 Arabic</option><option value="fr">🇫🇷 French</option><option value="de">🇩🇪 German</option><option value="es">🇪🇸 Spanish</option><option value="it">🇮🇹 Italian</option><option value="ja">🇯🇵 Japanese</option><option value="ko">🇰🇷 Korean</option><option value="zh">🇨🇳 Chinese</option><option value="ru">🇷🇺 Russian</option><option value="tr">🇹🇷 Turkish</option><option value="fa">🇮🇷 Persian</option><option value="pt">🇧🇷 Portuguese</option><option value="id">🇮🇩 Indo</option><option value="ms">🇲🇾 Malay</option><option value="th">🇹🇭 Thai</option><option value="vi">🇻🇳 Viet</option><option value="my">🇲🇲 Myanmar</option><option value="si">🇱🇰 Sinhala</option><option value="af">🇿🇦 Afrikaans</option><option value="sq">🇦🇱 Albanian</option><option value="am">🇪🇹 Amharic</option><option value="hy">🇦🇲 Armenian</option><option value="az">🇦🇿 Azeri</option><option value="be">🇧🇾 Belarus</option><option value="bg">🇧🇬 Bulgarian</option><option value="hr">🇭🇷 Croatian</option><option value="cs">🇨🇿 Czech</option><option value="da">🇩🇰 Danish</option><option value="nl">🇳🇱 Dutch</option><option value="fi">🇫🇮 Finnish</option><option value="el">🇬🇷 Greek</option><option value="he">🇮🇱 Hebrew</option><option value="hu">🇭🇺 Hungarian</option><option value="is">🇮🇸 Icelandic</option><option value="pl">🇵🇱 Polish</option><option value="ro">🇷🇴 Romanian</option><option value="sv">🇸🇪 Swedish</option><option value="uk">🇺🇦 Ukrainian</option><option value="zu">🇿🇦 Zulu</option></select></div><div class="flag-grid" id="g"></div><textarea id="i" class="font-bn" placeholder="Alhamdulillah">Alhamdulillah</textarea></div><div class="card"><button class="btn-main" onclick="tr()">TRANSLATE NOW - ALL COUNTRIES</button><textarea id="o" class="font-bn" placeholder="আলহামদুলিল্লাহ...">আলহামদুলিল্লাহ...</textarea><div class="btn-row"><button class="btn-sm" onclick="copyT()">📋 Copy</button><button class="btn-sm" onclick="spk()">🔊 Speak</button><button class="btn-sm" onclick="clr()">🗑️ Clear</button></div><div class="btn-row"><button class="btn-sm" onclick="makePDF()" style="background:#ffaa00;color:#000;font-weight:bold">📄 PDF বানাও</button></div></div><script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>
const C="BD,US,IN,PK,SA,AE,GB,DE,FR,IT,ES,JP,CN,KR,RU,TR,IR,BR,AF,AL,DZ,AD,AO,AG,AR,AM,AT,AZ,BS,BH,BB,BY,BE,BZ,BJ,BT,BO,BA,BW,BN,BG,BF,BI,KH,CM,CV,CF,TD,CL,CO,KM,CG,CR,HR,CU,CY,CZ,DK,DJ,DM,DO,EC,EG,SV,GQ,ER,EE,ET,FJ,FI,GA,GM,GE,GH,GR,GD,GT,GN,GW,GY,HT,HN,HU,IS,ID,IQ,IE,IL,JM,JO,KZ,KE,KI,KP,KW,KG,LA,LV,LB,LS,LR,LY,LI,LT,LU,MG,MW,MY,MV,ML,MT,MH,MR,MU,MX,FM,MD,MC,MN,ME,MA,MZ,MM,NA,NR,NP,NL,NZ,NI,NE,NG,MK,NO,OM".split(",");let g=document.getElementById("g");C.forEach(c=>{let f=String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt()));let d=document.createElement("div");d.className="flag-item";d.innerHTML=f+"<br>"+c;g.appendChild(d);});
function changeFont(){let v=fontSel.value;i.className=v;o.className=v;}
function startVoice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;let r=new R();r.lang="bn-BD";r.onresult=e=>{i.value=e.results[0][0].transcript;tr();};r.start();}
document.getElementById("cam").addEventListener("change",async e=>{let file=e.target.files[0];if(!file)return;o.value="✍️ পড়ছি...";let {data:{text}}=await Tesseract.recognize(file,'ben+eng');i.value=text;tr();});
async function tr(){let t=i.value,lv=l.value;if(!t)return;o.value="⏳ Translating...";try{let d=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t.slice(0,500))}&langpair=en|${lv}`).then(r=>r.json());o.value=d.responseData.translatedText||t;}catch{o.value=t;}}
function spk(){speechSynthesis.speak(new SpeechSynthesisUtterance(o.value));}
function copyT(){navigator.clipboard.writeText(o.value);alert("Copy Done দুস্ত!");}
function clr(){i.value="";o.value="";}
function makePDF(){let {jsPDF}=window.jspdf;let doc=new jsPDF();doc.text(doc.splitTextToSize(o.value||i.value,180),10,20);doc.save("TaqwaX1-10.pdf");}
</script></body></html>
