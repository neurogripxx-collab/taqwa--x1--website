<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAQWA X1 - All Language</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#050505}.glow{box-shadow:0 0 30px rgba(34,197,94,0.4)}</style></head>
<body class="min-h-screen flex flex-col text-white">
<header class="p-4 border-b border-green-500/20 flex justify-between items-center bg-black"><div class="flex items-center gap-2"><div class="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center font-bold text-black glow">X1</div><span class="font-bold">TAQWA X1 TRANSLATOR 🌍</span></div><div class="text-xs text-green-400">● LIVE - ALL LANG</div></header>

<div class="p-4 flex gap-2 bg-black">
<select id="src" class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl w-1/2 outline-none"><option value="auto">Auto Detect</option><option value="bn">বাংলা</option><option value="en">English</option><option value="ar">Arabic</option><option value="hi">Hindi</option><option value="ur">Urdu</option></select>
<select id="tgt" class="bg-zinc-900 border border-green-500/40 p-3 rounded-xl w-1/2 outline-none"><option value="en">English</option><option value="bn" selected>বাংলা</option><option value="ar">Arabic - العربية</option><option value="hi">Hindi</option><option value="ur">Urdu</option><option value="fr">French</option><option value="es">Spanish</option><option value="de">German</option><option value="ja">Japanese</option><option value="ko">Korean</option><option value="zh">Chinese</option><option value="ru">Russian</option></select>
</div>

<div class="flex-1 p-4 space-y-3 bg-black">
<textarea id="input" class="w-full h-36 bg-zinc-900 border border-zinc-800 p-4 rounded-2xl outline-none focus:border-green-500" placeholder="যেকোনো ভাষায় লেখো... Live Translate হবে! Type anything..." oninput="translateNow()"></textarea>
<div id="output" class="w-full min-h-36 bg-green-500/10 border border-green-500/30 p-4 rounded-2xl text-lg">Translation will appear here...</div>
<button onclick="translateNow()" class="w-full bg-white text-black py-3 rounded-2xl font-bold">TRANSLATE NOW</button>
</div>

<script>
const BACKEND = "https://taqwa-x1-engine-kmfo.onrender.com";
async function translateNow(){
 let text = document.getElementById('input').value.trim();
 if(!text) return;
 let target = document.getElementById('tgt').value;
 let source = document.getElementById('src').value;
 document.getElementById('output').innerText = "Translating...";
 try{
  let res = await fetch(`${BACKEND}/predict?text=${encodeURIComponent(text)}&target=${target}&source=${source}`);
  let data = await res.json();
  document.getElementById('output').innerText = data.translation || "Wait 20 sec, engine waking!";
 }catch(e){
  document.getElementById('output').innerText = "Engine waking up (cold start 30 sec). Try again!";
 }
}
</script>
</body></html>
