<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>TAQWA X1 9.0 ULTIMATE</title><link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500&family=Amiri:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet"><style>body{background:#000;color:#fff;text-align:center;padding:5px}.card{background:#111;border:3px solid #00ff88;border-radius:16px;padding:10px;max-width:950px;margin:auto}.flag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:3px;max-height:130px;overflow:auto;background:#050505;padding:6px;border-radius:8px}.flag-item{background:#222;padding:2px;border-radius:4px;font-size:7px} button{background:#00ff88;color:#000;border:none;padding:9px 11px;border-radius:9px;font-weight:bold;margin:2px} textarea,select{width:97%;padding:9px;border-radius:8px;background:#222;color:#fff;margin:3px 0;border:1px solid #333}.font-bn{font-family:'Anek Bangla',sans-serif}.font-ar{font-family:'Amiri',serif;font-size:18px}.font-hand{font-family:'Patrick Hand',cursive;font-size:17px}</style></head><body><h2 style="color:#00ff88">🚀 TAQWA X1 9.0 ULTIMATE</h2><div class="card"><button onclick="startVoice()">🎤 বলো</button><input type="file" id="cam" accept="image/*" capture><select id="fontSel" onchange="changeFont()"><option value="font-bn">🎨 বাংলা</option><option value="font-ar">🎨 আরবি</option><option value="font-hand">🎨 হাতের লেখা</option></select><select id="l"><option value="bn">🇧🇩 বাংলা</option><option value="en">🇺🇸 English</option><option value="as">🇮🇳 Assamese</option><option value="hi">🇮🇳 Hindi</option><option value="ur">🇮🇳 Urdu</option><option value="ta">🇮🇳 Tamil</option><option value="te">🇮🇳 Telugu</option><option value="ml">🇮🇳 Malayalam</option><option value="kn">🇮🇳 Kannada</option><option value="mr">🇮🇳 Marathi</option><option value="gu">🇮🇳 Gujarati</option><option value="pa">🇮🇳 Punjabi</option><option value="or">🇮🇳 Odia</option><option value="bho">🇮🇳 Bhojpuri</option><option value="mai">🇮🇳 Maithili</option><option value="doi">🇮🇳 Dogri</option><option value="sa">🇮🇳 Sanskrit</option><option value="ne">🇮🇳 Nepali</option><option value="mni-Mtei">🇮🇳 Manipuri</option><option value="ar">🇸🇦 Arabic</option><option value="fr">🇫🇷 French</option><option value="de">🇩🇪 German</option><option value="es">🇪🇸 Spanish</option><option value="it">🇮🇹 Italian</option><option value="ja">🇯🇵 Japanese</option><option value="ko">🇰🇷 Korean</option><option value="zh">🇨🇳 Chinese</option><option value="ru">🇷🇺 Russian</option><option value="tr">🇹🇷 Turkish</option><option value="fa">🇮🇷 Persian</option><option value="pt">🇧🇷 Portuguese</option><option value="id">🇮🇩 Indo</option><option value="ms">🇲🇾 Malay</option><option value="th">🇹🇭 Thai</option><option value="vi">🇻🇳 Viet</option><option value="my">🇲🇲 Myanmar</option><option value="si">🇱🇰 Sinhala</option><option value="af">🇿🇦 Afrikaans</option><option value="sq">🇦🇱 Albanian</option><option value="am">🇪🇹 Amharic</option><option value="hy">🇦🇲 Armenian</option><option value="az">🇦🇿 Azeri</option><option value="eu">Basque</option><option value="be">Belarus</option><option value="bg">Bulgarian</option><option value="ca">Catalan</option><option value="ceb">Cebuano</option><option value="hr">Croatian</option><option value="cs">Czech</option><option value="da">Danish</option><option value="nl">Dutch</option><option value="et">Estonian</option><option value="fil">Filipino</option><option value="fi">Finnish</option><option value="el">Greek</option><option value="ha">Hausa</option><option value="he">Hebrew</option><option value="hu">Hungarian</option><option value="is">Icelandic</option><option value="ig">Igbo</option><option value="ga">Irish</option><option value="kk">Kazakh</option><option value="km">Khmer</option><option value="rw">Kinyarwanda</option><option value="ky">Kyrgyz</option><option value="lv">Latvian</option><option value="lt">Lithuanian</option><option value="mk">Macedonian</option><option value="mt">Maltese</option><option value="mn">Mongolian</option><option value="no">Norwegian</option><option value="ps">Pashto</option><option value="pl">Polish</option><option value="ro">Romanian</option><option value="sr">Serbian</option><option value="sk">Slovak</option><option value="sl">Slovenian</option><option value="so">Somali</option><option value="sw">Swahili</option><option value="sv">Swedish</option><option value="tg">Tajik</option><option value="tt">Tatar</option><option value="uk">Ukrainian</option><option value="uz">Uzbek</option><option value="cy">Welsh</option><option value="zu">Zulu</option></select><div class="flag-grid" id="g"></div><textarea id="i" rows="2" class="font-bn" placeholder="লেখো / বলো / ছবি তোলো..."></textarea><button onclick="tr()">🌍 TRANSLATE</button><textarea id="o" rows="3" readonly class="font-bn"></textarea><br><button onclick="spk()">🗣️ শুনো</button><button onclick="makePDF()" style="background:#ffaa00">📄 PDF</button></div><script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>
const C="BD,US,IN,PK,SA,AE,GB,CA,AU,DE,FR,IT,ES,JP,CN,KR,RU,TR,IR,BR,AF,AL,DZ,AD,AO,AG,AR,AM,AT,AZ,BS,BH,BB,BY,BE,BZ,BJ,BT,BO,BA,BW,BN,BG,BF,BI,KH,CM,CV,CF,TD,CL,CO,KM,CG,CR,HR,CU,CY,CZ,DK,DJ,DM,DO,EC,EG,SV,GQ,ER,EE,ET,FJ,FI,GA,GM,GE,GH,GR,GD,GT,GN,GW,GY,HT,HN,HU,IS,ID,IQ,IE,IL,JM,JO,KZ,KE,KI,KP,KW,KG,LA,LV,LB,LS,LR,LY,LI,LT,LU,MG,MW,MY,MV,ML,MT,MH,MR,MU,MX,FM,MD,MC,MN,ME,MA,MZ,MM,NA,NR,NP,NL,NZ,NI,NE,NG,MK,NO,OM".split(",");let g=document.getElementById("g");C.forEach(c=>{let f=String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt()));let d=document.createElement("div");d.className="flag-item";d.innerHTML=f+"<br>"+c;g.appendChild(d);});
function changeFont(){let v=fontSel.value;i.className=v;o.className=v;}
function startVoice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert("Chrome এ খোলো দুস্ত!");let r=new R();r.lang="bn-BD";r.onresult=e=>{i.value=e.results[0][0].transcript;tr();};r.start();}
document.getElementById("cam").addEventListener("change",async e=>{let file=e.target.files[0];if(!file)return;o.value="✍️ পড়ছি...";let {data:{text}}=await Tesseract.recognize(file,'ben+eng+hin');i.value=text;o.value="✅ Done!";});
async function tr(){let t=i.value,lv=l.value;if(!t)return;o.value="⏳...";try{let d=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t.slice(0,500))}&langpair=auto|${lv}`).then(r=>r.json());o.value=d.responseData.translatedText;}catch{o.value=t;}}
function spk(){speechSynthesis.speak(new SpeechSynthesisUtterance(o.value));}
function makePDF(){let {jsPDF}=window.jspdf;let doc=new jsPDF();doc.text(doc.splitTextToSize(o.value||i.value,180),10,20);doc.save("TaqwaX1-Ultimate.pdf");}
</script></body></html>
