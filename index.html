<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAQWA X1 - Sovereign</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#050505} .glow{box-shadow:0 0 30px rgba(34,197,94,0.4)}</style>
</head>
<body class="min-h-screen flex flex-col text-white">
<header class="p-4 border-b border-green-500/20 flex justify-between items-center bg-black">
<div class="flex items-center gap-2"><div class="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center font-bold text-black glow">X1</div><span class="font-bold">TAQWA X1</span></div>
<div class="text-xs text-green-400">● LIVE</div>
</header>

<div id="chat" class="flex-1 overflow-y-auto p-4 space-y-4">
<div class="bg-zinc-900 border border-green-500/30 p-4 rounded-2xl">As-salamu Alaikum! I am <b>TAQWA X1</b> - 1000x faster than humans. Built by NeuroGripX.</div>
</div>

<div class="p-4 border-t border-zinc-900 bg-black sticky bottom-0">
<div class="flex gap-2 bg-zinc-900 border border-zinc-800 rounded-2xl p-2">
<input id="input" class="flex-1 bg-transparent px-3 py-2 outline-none" placeholder="Ask TAQWA X1..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()" id="btn" class="bg-white text-black px-6 py-2 rounded-xl font-bold">SEND</button>
</div>
</div>

<script>
const BACKEND = "https://taqwa-x1-engine-kmfo.onrender.com";
const chat = document.getElementById('chat');
const input = document.getElementById('input');

async function send(){
  const msg = input.value.trim(); if(!msg) return;
  chat.innerHTML += `<div class='flex justify-end'><div class='bg-green-500 text-black px-4 py-2 rounded-2xl'>${msg}</div></div>`;
  input.value = "";
  const loadId = "L"+Date.now();
  chat.innerHTML += `<div id="${loadId}" class='bg-zinc-800 p-3 rounded-2xl text-xs text-zinc-400'>X1 Thinking...</div>`;
  chat.scrollTop = chat.scrollHeight;
  
  let replyText = "";
  const payload = JSON.stringify({message: msg});
  const headers = {"Content-Type":"application/json"};
  
  // Try all possible endpoints
  const endpoints = [`${BACKEND}/`, `${BACKEND}/chat`, `${BACKEND}/api/chat`, `${BACKEND}/ask`, BACKEND];
  
  for(let url of endpoints){
    try{
      const res = await fetch(url, {method:"POST", headers, body: payload});
      const data = await res.json();
      if(data.detail === "Not Found") continue;
      replyText = data.reply || data.response || data.message || data.answer || JSON.stringify(data);
      if(replyText) break;
    }catch(e){ continue; }
  }
  
  document.getElementById(loadId).remove();
  if(!replyText) replyText = "Engine waking up (30 sec). Please SEND again - Render cold start!";
  chat.innerHTML += `<div class='bg-zinc-900 border border-green-500/20 p-4 rounded-2xl'>${replyText}</div>`;
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
