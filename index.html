async function tr(){
let t=document.getElementById('in').value;let l=document.getElementById('lang').value;
if(!t)return alert('লেখো দুস্ত!');

}
function spk(){let t=document.getElementById('out').value;if(!t)return;let u=new SpeechSynthesisUtterance(t);u.lang=document.getElementById('lang').value;u.rate=0.9;speechSynthesis.cancel();speechSynthesis.speak(u);}
