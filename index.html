<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAQWA X1 TRANSLATOR</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500&display=swap');
body{font-family:'Hind Siliguri', sans-serif}
</style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col">
<!-- HEADER - তোমার Screenshot এর মতো -->
<header class="p-4 border-b border-green-500/20 flex justify-between items-center">
<div class="flex items-center gap-2">
<div class="bg-green-500 text-black w-7 h-7 rounded flex items-center justify-center font-black text-sm">X1</div>
<div class="font-bold text-sm">TAQWA X1 TRANSLATOR <span class="text-green-400 text-[10px] ml-2">● LIVE - ALL LANG</span></div>
</div>
</header>

<!-- CONTROLS -->
<div class="p-3 flex gap-2">
<select id="src" class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl w-1/2 text-sm outline-none">
<option value="auto">Auto Detect</option>
<option value="bn">Bangla</option>
<option value="en">English</option>
<option value="ar">Arabic</option>
<option value="hi">Hindi</option>
</select>
<select id="tgt" class="bg-zinc-900 border border-green-500/40 p-3 rounded-xl w-1/2 text-sm outline-none">
<option value="bn">বাংলা</option>
<option value="en">English</option>
<option value="ar">Arabic</option>
<option value="hi">Hindi</option>
<option value="ur">Urdu</option>
</select>
</div>

<!-- MAIN -->
<div class="flex-1 p-3 space-y-3">
<textarea id="input" class="w-full h-36 bg-zinc-900 border border-zinc-800 p-4 rounded-2xl outline-none focus:border-green-500 text-base" placeholder="যেকোনো ভাষায় লেখো..."></textarea>
<div id="output" class="w-full min-h-[120px] bg-[#0a1a0a] border border-green-500/20 p-4 rounded-2xl text-base text-green-100">Translation will appear here...</div>
<button onclick="translateNow()" id="btn" class="w-full bg-white text-black py-4 rounded-2xl font-black tracking-widest">TRANSLATE NOW</button>
<div id="status" class="text-center text-[11px] text-zinc-500">Engine: taqwa-x1-engine-kmfo.onrender.com - Ready</div>
</div>

<script>
const BACKEND = "https://taqwa-x1-engine-kmfo.onrender.com";
async function translateNow(){
 const text = document.getElementById('input').value.trim();
 if(!text) return;
 const target = document.getElementById('tgt').value;
 const source = document.getElementById('src').value;
 const out = document.getElementById('output');
 const btn = document.getElementById('btn');
 out.innerText = "Translating...";
 btn.innerText = "TRANSLATING...";
 try{
  let res = await fetch(`${BACKEND}/predict?text=${encodeURIComponent(text)}&target=${target}&source=${source}`);
  let data = await res.json();
  // FIX: Engine sends 'translated' not 'translation'
  out.innerText = data.translated || data.translation || data.result || "Error";
  btn.innerText = "TRANSLATE NOW";
 }catch(e){
  out.innerText = "Engine is waking up (30 sec cold start). Please click TRANSLATE NOW again!";
  btn.innerText = "TRY AGAIN";
 }
}
</script>
</body>
</html>
