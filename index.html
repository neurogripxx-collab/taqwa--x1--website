<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAQWA X1 - 195 Languages</title>
<style>
body{background:#020a1a;margin:0;font-family:Arial;color:#fff}
.card{background:#0a1931;border:2px solid gold;border-radius:20px;padding:15px;margin:15px}
.langCard{background:#fff;color:#000;border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-weight:bold}
.langCard:hover{background:gold}
</style>
</head>
<body>

<div class="card" style="position:sticky;top:10px;z-index:999">
<h3 style="color:gold;text-align:center">195 Languages - Flag / Text / Voice Search</h3>
<div style="display:flex;gap:10px;background:#fff;border-radius:30px;padding:5px 15px">
<input id="langSearch" type="text" placeholder="Bangla, Arabic, English..." style="flex:1;border:none;padding:12px;outline:none" onkeyup="filterLang()">
<button onclick="startVoice()" id="micBtn" style="background:gold;border:none;border-radius:50%;width:45px;height:45px">M</button>
</div>
<p id="voiceStatus" style="text-align:center;color:#00ff88;font-size:12px">195 Languages Ready</p>
<div id="langGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-height:400px;overflow-y:auto;margin-top:10px"></div>
</div>

<div class="card">
<h2 style="color:gold;text-align:center">Makkah & Madina Live</h2>
<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:15px;margin-bottom:10px">
<iframe style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" src="https://www.youtube-nocookie.com/embed/5Ifr1_qWfYc?autoplay=1&mute=1" allowfullscreen></iframe>
</div>
<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:15px">
<iframe style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" src="https://www.youtube-nocookie.com/embed/Y6Y1aJp9Ghg?autoplay=1&mute=1" allowfullscreen></iframe>
</div>
</div>

<div class="card" style="border-color:#00ff88;background:#0a2a0a">
<h2 style="color:#00ff88;text-align:center">Hadith + Quran</h2>
<div style="background:#fff;color:#000;border-radius:12px;padding:12px">Innamal A'malu Binniyat - Bukhari 1</div>
</div>

<script>
const languages=[
["bn","BD","Bangla","bangla bd"], ["ar","SA","Arabic","arabic saudi"], ["en","US","English","english usa"],
["ur","PK","Urdu","urdu pakistan"], ["hi","IN","Hindi","hindi india"], ["tr","TR","Turkish","turkish turkey"],
["fa","IR","Persian","persian iran"], ["ps","AF","Pashto","pashto afghanistan"], ["ru","RU","Russian","russian russia"],
["zh","CN","Chinese","chinese china"], ["ja","JP","Japanese","japanese japan"], ["ko","KR","Korean","korean korea"],
["de","DE","German","german germany"], ["fr","FR","French","french france"], ["es","ES","Spanish","spanish spain"],
["it","IT","Italian","italian italy"], ["pt","PT","Portuguese","portuguese portugal"], ["id","ID","Indonesian","indonesian"],
["ms","MY","Malay","malay malaysia"], ["th","TH","Thai","thai thailand"], ["vi","VN","Vietnamese","vietnamese vietnam"],
["sw","TZ","Swahili","swahili tanzania"], ["ha","NG","Hausa","hausa nigeria"], ["am","ET","Amharic","amharic ethiopia"],
["so","SO","Somali","somali somalia"], ["yo","NG","Yoruba","yoruba"], ["ig","NG","Igbo","igbo"], ["zu","ZA","Zulu","zulu"],
["af","ZA","Afrikaans","afrikaans"], ["nl","NL","Dutch","dutch netherlands"], ["pl","PL","Polish","polish poland"],
["uk","UA","Ukrainian","ukrainian"], ["el","GR","Greek","greek"], ["he","IL","Hebrew","hebrew israel"],
["ta","IN","Tamil","tamil"], ["te","IN","Telugu","telugu"], ["ml","IN","Malayalam","malayalam"], ["kn","IN","Kannada","kannada"],
["mr","IN","Marathi","marathi"], ["gu","IN","Gujarati","gujarati"], ["pa","IN","Punjabi","punjabi"], ["as","IN","Assamese","assamese"],
["ne","NP","Nepali","nepali nepal"], ["si","LK","Sinhala","sinhala srilanka"], ["my","MM","Myanmar","myanmar burma"],
["km","KH","Khmer","khmer cambodia"], ["lo","LA","Lao","lao laos"], ["uz","UZ","Uzbek","uzbek uzbekistan"],
["kk","KZ","Kazakh","kazakh kazakhstan"], ["az","AZ","Azerbaijan","azerbaijan"], ["ky","KG","Kyrgyz","kyrgyz kyrgyzstan"],
["tg","TJ","Tajik","tajik tajikistan"], ["mn","MN","Mongolian","mongolian mongolia"], ["sq","AL","Albanian","albanian albania"],
["bs","BA","Bosnian","bosnian bosnia"], ["bg","BG","Bulgarian","bulgarian bulgaria"], ["hr","HR","Croatian","croatian croatia"],
["cs","CZ","Czech","czech czechia"], ["da","DK","Danish","danish denmark"], ["et","EE","Estonian","estonian estonia"],
["fi","FI","Finnish","finnish finland"], ["hu","HU","Hungarian","hungarian hungary"], ["is","IS","Icelandic","icelandic iceland"],
["ga","IE","Irish","irish ireland"], ["lv","LV","Latvian","latvian latvia"], ["lt","LT","Lithuanian","lithuanian lithuania"],
["mt","MT","Maltese","maltese malta"], ["no","NO","Norwegian","norwegian norway"], ["ro","RO","Romanian","romanian romania"],
["sr","RS","Serbian","serbian serbia"], ["sk","SK","Slovak","slovak slovakia"], ["sl","SI","Slovenian","slovenian slovenia"],
["sv","SE","Swedish","swedish sweden"], ["en-gb","GB","English UK","english uk"], ["pt-br","BR","Portuguese BR","portuguese brazil"],
["es-mx","MX","Spanish MX","spanish mexico"], ["en-ca","CA","English CA","english canada"], ["en-au","AU","English AU","english australia"],
["ar-eg","EG","Arabic EG","arabic egypt"], ["ar-dz","DZ","Arabic DZ","arabic algeria"], ["ar-ma","MA","Arabic MA","arabic morocco"],
["ar-iq","IQ","Arabic IQ","arabic iraq"], ["en-ng","NG","English NG","english nigeria"], ["en-ke","KE","English KE","english kenya"],
["en-gh","GH","English GH","english ghana"], ["en-za","ZA","English ZA","english south africa"], ["fr-sn","SN","French SN","french senegal"],
["pt-ao","AO","Portuguese AO","portuguese angola"], ["es-co","CO","Spanish CO","spanish colombia"], ["es-pe","PE","Spanish PE","spanish peru"],
["en-jm","JM","English JM","english jamaica"], ["ti","ER","Tigrinya","tigrinya eritrea"], ["mg","MG","Malagasy","malagasy madagascar"],
["rw","RW","Kinyarwanda","rwanda"], ["ln","CD","Lingala","lingala"], ["ak","GH","Akan","akan"], ["bm","ML","Bambara","bambara"],
["sg","CF","Sango","sango"], ["nd","ZW","Ndebele","ndebele"], ["sn","ZW","Shona","shona"], ["st","LS","Sesotho","sesotho"],
["tn","BW","Setswana","tswana"], ["ss","SZ","SiSwati","siswati"], ["en-ph","PH","English PH","english philippines"],
["tl","PH","Tagalog","tagalog"], ["bo","CN","Tibetan","tibetan"], ["ug","CN","Uyghur","uyghur"], ["de-at","AT","German AT","german austria"],
["de-ch","CH","German CH","german switzerland"], ["cy","GB","Welsh","welsh"], ["eu","ES","Basque","basque"], ["ca","ES","Catalan","catalan"],
["lb","LU","Luxembourgish","luxembourgish"], ["li","LI","German LI","german liechtenstein"], ["el-cy","CY","Greek CY","greek cyprus"]
];
let grid=document.getElementById('langGrid');
function render(arr){grid.innerHTML='';arr.forEach(l=>{let d=document.createElement('div');d.className='langCard';d.innerHTML=l[1]+'<br>'+l[2];d.onclick=()=>{document.getElementById('voiceStatus').innerText=l[2]+' Selected!';};grid.appendChild(d);});}
render(languages);
function filterLang(){let v=document.getElementById('langSearch').value.toLowerCase();let f=languages.filter(x=>x[3].includes(v)||x[2].toLowerCase().includes(v));render(f);}
function startVoice(){let s=document.getElementById('voiceStatus');let b=document.getElementById('micBtn');if(!('webkitSpeechRecognition' in window)){alert('Use Chrome');return;}let r=new webkitSpeechRecognition();r.start();b.innerText='R';s.innerText='Listening...';r.onresult=e=>{let t=e.results[0][0].transcript.toLowerCase();document.getElementById('langSearch').value=t;filterLang();s.innerText='Voice: '+t;b.innerText='M';};}
</script>
</body>
</html>
